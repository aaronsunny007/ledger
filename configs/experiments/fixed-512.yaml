# Experiment: fixed-512. Differs from configs/retrieval.yaml only in: chunking.strategy=fixed; chunking.size=512; chunking.overlap=64
chunking:
  strategy: fixed
  size: 512
  overlap: 64
retrieval:
  embedder: bge-small
  mode: hybrid
  candidates: 30
  rrf_k: 60
  rerank: true
  reranker: BAAI/bge-reranker-base
  top_k: 6
  min_score: 0.0
  pin_statements: true
  latest_year_only: true
answer:
  verify: true
  regenerate_on_failure: true
  max_context_chars: 24000
cache:
  enabled: true
  threshold: 0.92
