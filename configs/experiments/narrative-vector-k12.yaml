# Experiment: narrative-vector-k12. Differs from configs/retrieval.yaml in: top_k=12, candidates=40
chunking:
  strategy: table
  size: 1024
  overlap: 128
retrieval:
  embedder: bge-small
  mode: vector
  candidates: 40
  rrf_k: 60
  rerank: false
  reranker: BAAI/bge-reranker-base
  top_k: 12
  min_score: 0.0
  pin_statements: true
  latest_year_only: true
answer:
  verify: true
  regenerate_on_failure: true
  max_context_chars: 18000
cache:
  enabled: true
  threshold: 0.92
