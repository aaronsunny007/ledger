# Experiment: hybrid-rerank. The default until 2026-10-10: differs from configs/retrieval.yaml only in:
# retrieval.mode=hybrid, retrieval.rerank=True
chunking:
  strategy: table
  size: 1024
  overlap: 128
retrieval:
  embedder: bge-small
  mode: hybrid
  candidates: 30
  rrf_k: 60
  rerank: true
  reranker: BAAI/bge-reranker-base
  top_k: 6
  min_score: 0.0
  pin_statements: true
  latest_year_only: true
answer:
  verify: true
  regenerate_on_failure: true
  max_context_chars: 18000
cache:
  enabled: true
  threshold: 0.92
