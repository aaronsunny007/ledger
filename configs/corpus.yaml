# Ledger corpus (ADR-001): US SEC 10-K filings, ~40 companies, 3 fiscal years.
#
# The first block is the companies in the FinanceBench open set. Run
#   python scripts/financebench_companies.py
# to print the exact companies and fiscal years the 150 questions need, and
# paste any per-company `years:` it reports below. Until then every company
# uses the default `years`.
#
# `aliases` are how people name the company in a question; they drive the
# company filter (RET-2), so add any you see the eval miss.

years: [2021, 2022, 2023]
form: 10-K

companies:
  # --- FinanceBench open set ---
  - {ticker: MMM, name: 3M, aliases: [3M Company]}
  - {ticker: ATVI, name: Activision Blizzard, aliases: [Activision]}
  - {ticker: ADBE, name: Adobe, aliases: [Adobe Inc]}
  - {ticker: AES, name: AES Corporation, aliases: [AES Corp]}
  - {ticker: AMZN, name: Amazon, aliases: [Amazon.com]}
  - {ticker: AMCR, name: Amcor, aliases: [Amcor plc]}
  - {ticker: AMD, name: Advanced Micro Devices, aliases: [AMD]}
  - {ticker: AXP, name: American Express, aliases: [AmEx, Amex]}
  - {ticker: AWK, name: American Water Works, aliases: [American Water]}
  - {ticker: BBY, name: Best Buy}
  - {ticker: SQ, name: Block, aliases: [Block Inc, Square]}
  - {ticker: BA, name: Boeing}
  - {ticker: KO, name: Coca-Cola, aliases: [Coca Cola, CocaCola]}
  - {ticker: GLW, name: Corning}
  - {ticker: COST, name: Costco}
  - {ticker: CVS, name: CVS Health, aliases: [CVS]}
  - {ticker: FL, name: Foot Locker}
  - {ticker: GIS, name: General Mills}
  - {ticker: JNJ, name: Johnson & Johnson, aliases: [Johnson and Johnson, J&J]}
  - {ticker: JPM, name: JPMorgan Chase, aliases: [JPMorgan, JP Morgan]}
  - {ticker: KHC, name: Kraft Heinz}
  - {ticker: LMT, name: Lockheed Martin}
  - {ticker: MGM, name: MGM Resorts}
  - {ticker: MSFT, name: Microsoft}
  - {ticker: NFLX, name: Netflix}
  - {ticker: NKE, name: Nike}
  - {ticker: PYPL, name: PayPal}
  - {ticker: PEP, name: PepsiCo, aliases: [Pepsi]}
  - {ticker: PFE, name: Pfizer}
  - {ticker: ULTA, name: Ulta Beauty, aliases: [Ulta]}
  - {ticker: VZ, name: Verizon}
  - {ticker: WMT, name: Walmart}
  # --- extra large caps, used by the XBRL-generated questions ---
  - {ticker: AAPL, name: Apple}
  - {ticker: GOOGL, name: Alphabet, aliases: [Google]}
  - {ticker: META, name: Meta Platforms, aliases: [Meta, Facebook]}
  - {ticker: NVDA, name: NVIDIA, aliases: [Nvidia]}
  - {ticker: TSLA, name: Tesla}
  - {ticker: INTC, name: Intel}
  - {ticker: HD, name: Home Depot, aliases: [The Home Depot]}
  - {ticker: PG, name: Procter & Gamble, aliases: [Procter and Gamble, P&G]}
