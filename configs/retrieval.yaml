# Experiment knobs (RET-4). Every eval run copies this file into its result
# JSON so a number can always be traced back to the settings behind it.

chunking:
  strategy: table      # fixed | section | table
  size: 1024           # characters
  overlap: 128

retrieval:
  embedder: bge-small  # hashing (tests only) | bge-small | bge-base
  mode: vector         # vector | keyword | hybrid (vector matched hybrid in the retrieval experiments)
  candidates: 30       # into the reranker (RET-3: 30-50)
  rrf_k: 60
  rerank: false        # true adds ~12 s per question on a CPU for +0-7 points of recall; see README
  reranker: BAAI/bge-reranker-base  # v2-m3 is the measured alternative (ADR-004)
  top_k: 6             # passages given to the model (RET-3: 5-8)
  min_score: 0.0       # refuse below this rerank score; tune on the dev split
  pin_statements: true # always include the balance sheet / income / cash flow a question needs
  latest_year_only: true # several years named -> latest filing (it holds the comparatives)
  # Questions that need no primary statement (acquisitions, customers, legal matters) are
  # answered from prose. Keyword fusion over 30 candidates and 10 passages raised
  # FinanceBench recall from 76.5% to 80.0% with XBRL unchanged, at no measurable latency.
  narrative_mode: hybrid
  narrative_candidates: 30
  narrative_top_k: 10
  narrative_rerank: false

answer:
  verify: true
  regenerate_on_failure: true
  max_context_chars: 18000

cache:
  enabled: true
  threshold: 0.92      # tune from the hit-rate / false-hit curve (CACHE-2)
