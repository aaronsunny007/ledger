name: nightly-eval

# CI-3: the full eval runs nightly and on release tags; result JSON is
# committed to eval/results/. A run on main also refreshes the smoke
# baseline that the PR gate compares against.

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      split:
        description: "dev | test | all"
        default: test

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || format('Ledger research {0}@users.noreply.github.com', github.repository_owner) }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[models,tracing]"
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed
            ~/.cache/huggingface
          key: corpus-${{ hashFiles('configs/corpus.yaml', 'configs/retrieval.yaml', 'ledger/ingest/**') }}
      - run: ledger download && ledger ingest
      - name: Smoke set (refresh the PR baseline)
        run: python eval/run_eval.py --smoke --sleep 4 --write-baseline
      - name: Full eval
        run: python eval/run_eval.py --split ${{ inputs.split || 'test' }} --judge --sleep 4
      - name: Commit results
        run: |
          git config user.name "ledger-eval-bot"
          git config user.email "ledger-eval-bot@users.noreply.github.com"
          git add eval/results
          git commit -m "eval: nightly results $(date -u +%F) [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
