name: prelaunch

# Runs the pre-launch question set (eval/prelaunch/questions.yaml) against the same prebuilt
# index the public demo starts from, with the real model, and commits a report you can read:
# eval/results/<timestamp>-prelaunch.md. Needs the GEMINI_API_KEY secret and the demo-index
# release (run build-demo-index first). About 45 questions, so well inside one day's free quota.
# If the quota runs out mid-way the report says so; run it again after the reset.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
  LLM_MODEL: ${{ vars.LLM_MODEL }}
  LLM_MODEL_LARGE: ${{ vars.LLM_MODEL_LARGE }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  STORE: memory

jobs:
  prelaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check the API key
        run: |
          [ -n "$GEMINI_API_KEY$GROQ_API_KEY" ] || { echo "::error::Add a GEMINI_API_KEY repository secret."; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[models,tracing]"
      - name: Download the demo index (the one the Space will use)
        run: |
          curl -fsSL --retry 3 "https://github.com/${{ github.repository }}/releases/download/demo-index/demo-index.tar.gz" -o index.tar.gz
          tar -xzf index.tar.gz
          ls data/processed/index/*/chunks.jsonl
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small
      - name: Run the pre-launch questions
        run: python eval/prelaunch.py --sleep 4 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the report
        if: always()
        run: |
          git config user.name "ledger-eval-bot"
          git config user.email "ledger-eval-bot@users.noreply.github.com"
          git add eval/results
          git commit -m "eval: pre-launch report" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
