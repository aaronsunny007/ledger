name: full-eval

# The headline numbers: Ledger on the full test split (FinanceBench 10-K,
# XBRL and hand-written questions, text answers graded by the LLM judge),
# and the long-context baseline (whole filing, no retrieval) on the same
# questions. Needs the GEMINI_API_KEY secret (or GROQ_API_KEY with the
# repository variable LLM_PROVIDER=groq). Results are committed.
#
# Free tiers cap requests per day. When the cap is hit, a run stops and is
# saved as partial; the next manual run, or the daily schedule below,
# continues it, so the test split completes over a few days at no cost.

on:
  schedule:
    - cron: "17 9 * * *"  # after the Gemini daily quota resets (midnight Pacific)
  workflow_dispatch:
    inputs:
      split:
        description: dev | test | all
        default: test
      baseline:
        description: also run the long-context baseline
        type: boolean
        default: true
      allow_hash_ledger:
        description: "Ledger: code hashes whose runs may be reused/resumed (only for changes that cannot alter answers)"
        default: ""
      allow_hash_baseline:
        description: "Baseline: same, for the long-context baseline"
        default: ""
      tag_suffix:
        description: "Ledger repeat for the noise estimate: a suffix such as -repeat1 starts a fresh run saved under its own tag instead of reusing the finished one"
        default: ""

permissions:
  contents: write

env:
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
  LLM_MODEL: ${{ vars.LLM_MODEL }}
  LLM_MODEL_LARGE: ${{ vars.LLM_MODEL_LARGE }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Aaron Gandi aarongandi007@gmail.com' }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

jobs:
  check:
    # A scheduled run only continues a partial run; it never starts a new one.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then
            echo go=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          go=false
          for tag in ledger-test long-context-test; do
            last=$(ls eval/results/*-"$tag".json 2>/dev/null | sort | tail -1)
            if [ -n "$last" ] && grep -q '"partial": true' "$last"; then go=true; fi
          done
          echo "go=$go" | tee -a "$GITHUB_OUTPUT"

  eval:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SPLIT: ${{ inputs.split || 'test' }}
      ALLOW_HASH_LEDGER: ${{ inputs.allow_hash_ledger }}
      ALLOW_HASH_BASELINE: ${{ inputs.allow_hash_baseline }}
      TAG_SUFFIX: ${{ inputs.tag_suffix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the API key
        id: key
        run: |
          if [ -z "$GEMINI_API_KEY$GROQ_API_KEY" ]; then
            echo "::error::Add a GEMINI_API_KEY secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "$LLM_PROVIDER" = gemini ]; then
            model="${LLM_MODEL:-gemini-3.5-flash-lite}"
            # The free tier's limit is a rolling window: a 429 usually says how long
            # until requests free up. Wait for short delays, up to 3 probes.
            for attempt in 1 2 3; do
              code=$(curl -s -o probe.json -w "%{http_code}" \
                -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
                -d '{"contents":[{"parts":[{"text":"Reply with OK"}]}]}' \
                "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")
              echo "Gemini $model -> HTTP $code (probe $attempt)"
              [ "$code" = 429 ] || break
              grep -o '"message": *"[^"]*"' probe.json | head -1 || true
              delay=$(grep -o 'retry in [0-9hms.]*' probe.json | head -1 | sed 's/retry in //')
              if [ -z "$delay" ]; then wait=-1; else
                h=$(echo "$delay" | grep -o '[0-9]*h' | tr -d h)
                m=$(echo "$delay" | grep -o '[0-9]*m' | tr -d m)
                sec=$(echo "$delay" | grep -o '[0-9.]*s' | tr -d s | cut -d. -f1)
                wait=$(( ${h:-0} * 3600 + ${m:-0} * 60 + ${sec:-0} ))
              fi
              if [ "$wait" -lt 0 ] || [ "$wait" -gt 1800 ]; then break; fi
              echo "Waiting $((wait + 30))s for the quota window."
              sleep $((wait + 30))
            done
            if [ "$code" = 429 ]; then
              # Quota still spent after waiting: not a failure, the next run resumes.
              echo "::warning::Gemini free-tier quota is used up; skipping. The next run resumes."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$code" != 200 ]; then
              grep -o '"message": *"[^"]*"' probe.json || true
              echo "::error::Gemini key or model rejected (HTTP $code). Set the LLM_MODEL variable to a current model if this one was retired."
              exit 1
            fi
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        if: steps.key.outputs.ok == 'true'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[models,tracing]"
      - if: steps.key.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('eval/golden/**', 'configs/corpus.yaml', 'ledger/ingest/edgar.py') }}
      - if: steps.key.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/processed
            ~/.cache/huggingface
          key: index-table-${{ hashFiles('eval/golden/**', 'configs/corpus.yaml', 'ledger/ingest/**/*.py') }}
      - name: Download and index (skipped when cached)
        if: steps.key.outputs.ok == 'true'
        run: |
          python eval/run_eval.py --split all --sources financebench xbrl --print-needs > needs.txt
          awk '{y[$1]=y[$1]" "$2} END {for (t in y) print t y[t]}' needs.txt | while read -r t ys; do
            ledger download --tickers "$t" --years $ys
          done
          ledger ingest | tail -5
      # Step timeouts leave time to commit; results are saved every 10 questions.
      - name: Ledger
        if: steps.key.outputs.ok == 'true'
        id: ledger
        timeout-minutes: 150
        run: |
          python eval/run_eval.py --split "$SPLIT" --judge --sleep 4 --resume --allow-hash $ALLOW_HASH_LEDGER \
            --tag "ledger-$SPLIT$TAG_SUFFIX" --summary ledger.md
          cat ledger.md >> "$GITHUB_STEP_SUMMARY"
      - name: Long-context baseline
        if: always() && steps.ledger.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.baseline)
        timeout-minutes: 150
        run: |
          python eval/run_eval.py --system long-context --split "$SPLIT" --judge \
            --sleep 15 --resume --allow-hash $ALLOW_HASH_BASELINE --tag "long-context-$SPLIT" --summary baseline.md
          cat baseline.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: always()
        run: |
          git config user.name "ledger-eval-bot"
          git config user.email "ledger-eval-bot@users.noreply.github.com"
          git add eval/results
          git commit -m "eval: full $SPLIT run" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
