name: build-golden

# One click (Actions tab -> build-golden -> Run workflow) builds the golden
# set from public data and commits it: the FinanceBench open set from
# Hugging Face and XBRL-generated numeric questions from SEC EDGAR.
# SEC asks for a contact in the User-Agent: set the SEC_USER_AGENT secret
# ("Your Name your@email.com"); without it the repo owner's GitHub noreply address is used.

on:
  workflow_dispatch:
    inputs:
      xbrl_n:
        description: number of XBRL questions
        default: "150"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || format('Ledger research {0}@users.noreply.github.com', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: FinanceBench open set
        run: |
          python scripts/financebench.py --list | tee financebench-needs.txt
          python scripts/financebench.py
      - name: SEC access check
        run: |
          for url in https://www.sec.gov/files/company_tickers.json \
                     https://data.sec.gov/submissions/CIK0000320193.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: $SEC_USER_AGENT" \
                   -H "Accept-Encoding: gzip, deflate" "$url")
            echo "$code $url" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: XBRL questions
        run: python scripts/make_xbrl_questions.py --n ${{ inputs.xbrl_n }}
      - name: Summary
        run: |
          echo '### Golden set built' >> "$GITHUB_STEP_SUMMARY"
          wc -l eval/golden/*.jsonl >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat financebench-needs.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "ledger-eval-bot"
          git config user.email "ledger-eval-bot@users.noreply.github.com"
          git add eval/golden
          git commit -m "eval: build golden set from FinanceBench and SEC XBRL" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
