name: experiments

# Retrieval experiments for the README results table (no LLM, so no key and
# no cost): chunking (table / section / fixed 1024 / fixed 512) and, on the
# table index, search mode, reranker and statement pinning. Every run covers
# all answerable FinanceBench (10-K) and XBRL questions; the report table
# uses the test split. Results are committed to eval/results/.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Aaron Gandi aarongandi007@gmail.com' }}

jobs:
  download:
    # Once, so parallel jobs do not exceed SEC's 10 requests per second.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('eval/golden/**', 'configs/corpus.yaml', 'ledger/ingest/edgar.py') }}
      - name: Download every filing the golden set needs
        run: |
          python eval/run_eval.py --split all --sources financebench xbrl --print-needs > needs.txt
          echo "$(wc -l < needs.txt) filings needed"
          # One call per company with all its years.
          awk '{y[$1]=y[$1]" "$2} END {for (t in y) print t y[t]}' needs.txt | while read -r t ys; do
            ledger download --tickers "$t" --years $ys
          done
          echo "$(ls data/raw/*/*/filing.htm | wc -l) filings on disk"

  retrieval:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: table
            runs: >-
              configs/retrieval.yaml:default
              configs/experiments/no-pin-statements.yaml:no-pin-statements
              configs/experiments/hybrid-no-rerank.yaml:hybrid-no-rerank
              configs/experiments/vector-only.yaml:vector-only
              configs/experiments/keyword-only.yaml:keyword-only
              configs/experiments/rerank-v2-m3.yaml:rerank-v2-m3
          - index: section
            runs: configs/experiments/section.yaml:section
          - index: fixed-1024
            runs: configs/experiments/fixed-1024.yaml:fixed-1024
          - index: fixed-512
            runs: configs/experiments/fixed-512.yaml:fixed-512
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[models]"
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('eval/golden/**', 'configs/corpus.yaml', 'ledger/ingest/edgar.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache@v4
        with:
          path: |
            data/processed
            ~/.cache/huggingface
          key: index-${{ matrix.index }}-${{ hashFiles('eval/golden/**', 'configs/**', 'ledger/ingest/**') }}
      - name: Index (${{ matrix.index }})
        run: |
          first=$(echo "${{ matrix.runs }}" | awk '{print $1}' | cut -d: -f1)
          ledger ingest --config "$first" | tail -5
      - name: Retrieval runs
        run: |
          for run in ${{ matrix.runs }}; do
            cfg="${run%%:*}"; tag="${run##*:}"
            echo "::group::$tag"
            python eval/retrieval_eval.py --config "$cfg" --tag "$tag"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-${{ matrix.index }}
          path: eval/results/retrieval/*.json

  report:
    needs: retrieval
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: retrieval-*
          path: eval/results/retrieval
          merge-multiple: true
      - name: Build the table
        run: |
          python eval/experiments_report.py
          cat eval/results/experiments-retrieval.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "ledger-eval-bot"
          git config user.email "ledger-eval-bot@users.noreply.github.com"
          git add eval/results
          git commit -m "eval: retrieval experiments" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
