name: ci

# CI-1: every pull request runs lint, types and unit tests, then the
# 50-question smoke eval. CI-2: the PR fails if accuracy, groundedness or
# refusal accuracy drop more than 2 points below main's baseline.
# The smoke eval needs a GEMINI_API_KEY (or GROQ_API_KEY) repository secret
# and a built golden set; until both exist it is skipped, not failed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 5s --health-retries 10
    env:
      LEDGER_TEST_DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Tests (coverage >= 70% on non-LLM code)
        run: pytest --cov --cov-report=term-missing

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-eval:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check prerequisites
        id: pre
        run: |
          if [ -z "$GEMINI_API_KEY$GROQ_API_KEY" ] || [ -z "$SEC_USER_AGENT" ] \
             || ! ls eval/golden/financebench.jsonl eval/golden/xbrl.jsonl >/dev/null 2>&1; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Smoke eval skipped: needs GEMINI_API_KEY or GROQ_API_KEY, SEC_USER_AGENT and a built golden set (run the build-golden workflow)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.pre.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        if: steps.pre.outputs.run == 'true'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[models]"
      - name: Cache filings, index and models
        if: steps.pre.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed
            ~/.cache/huggingface
          key: corpus-${{ hashFiles('configs/corpus.yaml', 'configs/retrieval.yaml', 'ledger/ingest/**') }}
      - name: Download and index filings (cached after the first run)
        if: steps.pre.outputs.run == 'true'
        run: ledger download && ledger ingest
      - name: Smoke eval + regression gate
        if: steps.pre.outputs.run == 'true'
        run: python eval/run_eval.py --smoke --gate --sleep 4 --summary smoke.md
      - name: Report
        if: always() && steps.pre.outputs.run == 'true'
        run: cat smoke.md >> "$GITHUB_STEP_SUMMARY" || true
