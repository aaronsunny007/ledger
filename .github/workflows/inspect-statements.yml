name: inspect-statements

# No LLM, no index: which filings have their balance sheet, income statement
# and cash flow statement tagged for statement pinning, with the near misses
# for the ones that are not. Commits eval/results/statements-coverage.md.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Aaron Gandi aarongandi007@gmail.com' }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('eval/golden/**', 'configs/corpus.yaml', 'ledger/ingest/edgar.py') }}
      - name: Download (skipped when cached)
        run: |
          python eval/run_eval.py --split all --sources financebench xbrl --print-needs > needs.txt
          awk '{y[$1]=y[$1]" "$2} END {for (t in y) print t y[t]}' needs.txt | while read -r t ys; do
            ledger download --tickers "$t" --years $ys
          done
      - name: Inspect
        run: |
          python eval/inspect_statements.py
          cat eval/results/statements-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "ledger-eval-bot"
          git config user.email "ledger-eval-bot@users.noreply.github.com"
          git add eval/results/statements-coverage.md
          git commit -m "eval: statement coverage" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
